name: GitHub Pages 배포

# main의 내용을 gh-pages 가지로 밀어내면 GitHub Pages가 그 가지를 그대로 서빙한다.
# (Pages 사이트 '개설' API는 기본 토큰 권한 밖이라, 가지 생성으로 자동 활성화되는 길을 쓴다)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: gh-pages 가지로 밀어내기
        run: git push --force origin HEAD:gh-pages
